[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, ...)
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modern syntax)
]
ignore = [
    "E501",  # line length — several modules carry long prose strings (exhibit text, walking
             # directions, prompt copy) that read worse wrapped than long; not enforced.
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's own idiom is `param: T = File(...)` / `Depends(...)` — not a real mutable-default bug.
"server.py" = ["B008"]
