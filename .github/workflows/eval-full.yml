name: RAG Eval (full, with LLM judge)

# Full eval including the gpt-4o-mini LLM-judge pass (groundedness/relevance
# scoring) — the deeper check that catches things deterministic checks can't,
# like a fluent-but-hallucinated answer. Costs more than eval.yml's per-PR
# run, so it's not on every push: runs weekly to catch drift (e.g. an OpenAI
# model update changing behavior) and on-demand via workflow_dispatch when
# you want the full picture before/after a prompt change.
on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  eval-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run full eval harness (deterministic + LLM judge)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m eval.run_eval --fail-under 0.9

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-full
          path: eval/results/
