name: RAG Eval

# Gate for the RAG chatbot: runs on every PR into main so a prompt or
# retrieval change that regresses answer quality is caught before merge,
# not after Railway auto-deploys it to production.
#
# Split into two jobs because GitHub does NOT expose repository secrets to
# `pull_request`-triggered workflow runs opened by Dependabot (security
# measure — a compromised dependency bump shouldn't be able to exfiltrate
# secrets via CI). `eval` (this file's required branch-protection check)
# covers everything that needs zero API calls, so Dependabot PRs can pass
# it; `rag-eval` covers the OpenAI-calling harness and is informational
# only — it can't be required without permanently red-X'ing every
# Dependabot PR.
#
# Deterministic checks only (--no-judge): retrieval hit, length budget,
# markdown-free output, shop URL presence, required/forbidden substrings.
# No LLM-judge here to keep every PR push cheap — the judge run lives in
# eval-full.yml (scheduled + manual) instead. See that file for why.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Syntax check (no API calls, fails fast)
        run: python -m py_compile rag_engine.py qa_pipeline.py context_router.py server.py navigation_routes.py exhibit_recognizer.py tts.py eval/run_eval.py

      - name: Lint (ruff, no API calls, fails fast)
        run: |
          pip install ruff
          ruff check .

      - name: Dependency vulnerability scan (no API calls, fails fast)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Unit tests (no API calls, fails fast)
        run: python -m pytest tests/ -q

      - name: Check FAISS index is not stale (no API calls, fails fast)
        run: python rag_engine.py --check-fresh
        # Catches the case where exhibits_data.py (or build_index()'s chunking
        # logic — see INDEX_SCHEMA_VERSION) changed but the committed
        # faiss_index/ wasn't rebuilt: without this, the eval step below would
        # silently pass against a stale index while production would too,
        # since server.py's get_or_build_index() just loads whatever's
        # committed. Pure hash comparison, no OpenAI calls.

  rag-eval:
    name: rag-eval (informational — needs OPENAI_API_KEY, not available on Dependabot PRs)
    runs-on: ubuntu-latest
    # Skip outright on Dependabot PRs instead of failing on a missing key —
    # the job would just error out anyway, this makes the reason visible
    # without a confusing red X.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run eval harness (deterministic checks only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m eval.run_eval --no-judge --fail-under 0.9
        # Still makes real OpenAI calls (RAGEngine's own embeddings + gpt-4o
        # chat completion per case) — that part can't be free, since it's
        # exercising the actual answer-generation path. --no-judge only cuts
        # the extra gpt-4o-mini grading call per case.

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results/
